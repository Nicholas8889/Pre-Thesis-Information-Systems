<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc">
  <title id="title">DFD Context Diagram - CV Tajuk Revenue Cycle Information System</title>
  <desc id="desc">Context Data Flow Diagram with orthogonal data-flow lines.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 11 5.5 L 0 11 z" fill="#111827"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#8fb6dc" flood-opacity="0.95"/>
    </filter>
    <style>
      .title { font: 700 24px Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .subtitle { font: 400 13px Arial, sans-serif; fill: #475569; text-anchor: middle; }
      .entity { fill: #b8d5f2; stroke: #5b8fc0; stroke-width: 1.5; filter: url(#softShadow); }
      .process-body { fill: #a8c9e8; stroke: #4f84b4; stroke-width: 1.7; }
      .process-head { fill: #2f89c5; stroke: #2b6f9f; stroke-width: 1.7; }
      .label { font: 700 15px Arial, sans-serif; fill: #1f2937; text-anchor: middle; }
      .small { font: 400 12px Arial, sans-serif; fill: #334155; text-anchor: middle; }
      .head-label { font: 700 15px Arial, sans-serif; fill: #ffffff; text-anchor: middle; }
      .flow { fill: none; stroke: #111827; stroke-width: 1.9; marker-end: url(#arrow); }
      .flow-label { font: 400 12px Arial, sans-serif; fill: #1f2937; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1500" height="820" fill="#ffffff"/>
  <text class="title" x="750" y="38">Context Diagram</text>
  <text class="subtitle" x="750" y="62">Data Flow Diagram - CV Tajuk Revenue Cycle Information System</text>

  <rect class="entity" x="80" y="120" width="190" height="84"/>
  <text class="label" x="175" y="154">Staff Sales</text>
  <text class="small" x="175" y="178">External Entity</text>

  <rect class="entity" x="80" y="310" width="190" height="84"/>
  <text class="label" x="175" y="344">Staff Admin</text>
  <text class="small" x="175" y="368">External Entity</text>

  <rect class="entity" x="80" y="500" width="190" height="84"/>
  <text class="label" x="175" y="534">Customer</text>
  <text class="small" x="175" y="558">No direct app login</text>

  <rect class="entity" x="1230" y="170" width="195" height="84"/>
  <text class="label" x="1328" y="204">General Manager</text>
  <text class="small" x="1328" y="228">External Entity</text>

  <rect class="entity" x="1230" y="455" width="195" height="84"/>
  <text class="label" x="1328" y="489">Administrator</text>
  <text class="small" x="1328" y="513">External Entity</text>

  <rect class="process-body" x="590" y="300" width="320" height="185" rx="18"/>
  <path class="process-head" d="M590 300 H910 V344 H590 Z"/>
  <text class="head-label" x="750" y="327">0</text>
  <text class="label" x="750" y="386">CV Tajuk Revenue Cycle</text>
  <text class="label" x="750" y="408">Information System</text>
  <text class="small" x="750" y="435">single process in context diagram</text>

  <path class="flow" d="M270 145 H455 V315 H590"/>
  <text class="flow-label" x="455" y="132">login, inquiry, order, customer outreach input</text>
  <path class="flow" d="M590 350 H420 V185 H270"/>
  <text class="flow-label" x="430" y="216">dashboard, inquiry/order status</text>

  <path class="flow" d="M270 342 H590"/>
  <text class="flow-label" x="430" y="326">invoice, payment, surat jalan, collections input</text>
  <path class="flow" d="M590 392 H430 V374 H270"/>
  <text class="flow-label" x="430" y="420">invoice, payment, delivery, receivable info</text>

  <path class="flow" d="M270 530 H455 V435 H590"/>
  <text class="flow-label" x="430" y="518">profile, request, PO, payment info</text>
  <path class="flow" d="M590 455 H430 V562 H270"/>
  <text class="flow-label" x="430" y="612">invoice, payment, surat jalan info</text>

  <path class="flow" d="M1230 200 H1045 V340 H910"/>
  <text class="flow-label" x="1060" y="187">approval decision, report filters</text>
  <path class="flow" d="M910 370 H1075 V230 H1230"/>
  <text class="flow-label" x="1080" y="262">dashboard, approval queue, audit trail</text>

  <path class="flow" d="M1230 480 H1045 V420 H910"/>
  <text class="flow-label" x="1060" y="468">account and role data</text>
  <path class="flow" d="M910 460 H1080 V515 H1230"/>
  <text class="flow-label" x="1085" y="553">account list, access status, audit info</text>
</svg>
