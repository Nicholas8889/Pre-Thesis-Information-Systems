<svg xmlns="http://www.w3.org/2000/svg" width="3600" height="2200" viewBox="0 0 3600 2200">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="9" dy="9" stdDeviation="0" flood-color="#93c5fd" flood-opacity="0.9"/>
    </filter>
    <filter id="storeShadow" x="-10%" y="-20%" width="130%" height="160%">
      <feDropShadow dx="14" dy="-14" stdDeviation="0" flood-color="#dbeafe" flood-opacity="1"/>
    </filter>
    <style>
      .title { font: 700 42px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 22px Arial, sans-serif; fill: #475569; }
      .entity { fill: #bfdbfe; stroke: #2563eb; stroke-width: 2.5; filter: url(#shadow); }
      .entity-title { font: 700 22px Arial, sans-serif; fill: #1f2937; text-anchor: middle; }
      .entity-sub { font: 400 17px Arial, sans-serif; fill: #374151; text-anchor: middle; }
      .process { fill: #bfdbfe; stroke: #2563eb; stroke-width: 2.5; }
      .process-head { fill: #0ea5e9; opacity: 0.85; }
      .process-num { font: 700 22px Arial, sans-serif; fill: #fff; text-anchor: middle; }
      .process-title { font: 700 21px Arial, sans-serif; fill: #1f2937; text-anchor: middle; }
      .process-sub { font: 400 16px Arial, sans-serif; fill: #374151; text-anchor: middle; }
      .store { fill: #dbeafe; stroke: #111827; stroke-width: 2.5; filter: url(#storeShadow); }
      .store-id { fill: #0ea5e9; stroke: #111827; stroke-width: 2.5; }
      .store-text { font: 700 20px Arial, sans-serif; fill: #1f2937; }
      .store-sub { font: 400 15px Arial, sans-serif; fill: #475569; }
      .store-code { font: 700 19px Arial, sans-serif; fill: #fff; text-anchor: middle; }
      .flow { fill: none; stroke: #111827; stroke-width: 3; marker-end: url(#arrow); }
      .flow-dashed { fill: none; stroke: #475569; stroke-width: 2.7; stroke-dasharray: 12 10; marker-end: url(#arrow); }
      .flow-label { font: 400 17px Arial, sans-serif; fill: #1f2937; }
      .small-label { font: 400 15px Arial, sans-serif; fill: #1f2937; }
      .legend { font: 400 17px Arial, sans-serif; fill: #334155; }
    </style>
  </defs>

