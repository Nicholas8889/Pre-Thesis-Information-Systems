  <text class="legend" x="120" y="2098">Legend: shaded blue box = external entity; rounded blue process = process; open-ended blue store = data store.</text>
  <text class="legend" x="120" y="2125">Lines use orthogonal routing with wider spacing. Dashed arrows indicate dashboard/reporting reads from data stores.</text>
