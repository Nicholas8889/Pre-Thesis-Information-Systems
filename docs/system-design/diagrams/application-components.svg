<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="title desc">
  <title id="title">Application Components - CV Tajuk Revenue Cycle Information System</title>
  <desc id="desc">Layered application component diagram for the CV Tajuk Revenue Cycle Information System modular monolith.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .layer { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; rx: 14; }
      .layer-title { font: 700 17px Arial, sans-serif; fill: #0f172a; }
      .box { stroke-width: 1.5; rx: 10; }
      .label { font: 700 15px Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .small { font: 400 12px Arial, sans-serif; fill: #475569; text-anchor: middle; }
      .arrow { fill: none; stroke: #475569; stroke-width: 1.6; marker-end: url(#arrow); }
      .thin { fill: none; stroke: #64748b; stroke-width: 1.2; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="1080" fill="#ffffff"/>
  <text x="600" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Application Components</text>
  <text x="600" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">CV Tajuk Revenue Cycle Information System - layered modular monolith</text>

  <rect class="layer" x="60" y="86" width="1080" height="112"/>
  <text class="layer-title" x="82" y="116">Presentation Layer</text>
  <rect class="box" x="405" y="126" width="390" height="48" fill="#dbeafe" stroke="#2563eb"/>
  <text class="label" x="600" y="147">User Interface</text>
  <text class="small" x="600" y="164">Next.js App Router Pages and React Components</text>

  <rect class="layer" x="60" y="224" width="1080" height="122"/>
  <text class="layer-title" x="82" y="254">Authentication and Authorization</text>
  <rect class="box" x="280" y="276" width="260" height="46" fill="#ede9fe" stroke="#7c3aed"/>
  <text class="label" x="410" y="295">Authentication</text>
  <text class="small" x="410" y="312">Login and signed session cookie</text>
  <rect class="box" x="660" y="276" width="260" height="46" fill="#ede9fe" stroke="#7c3aed"/>
  <text class="label" x="790" y="295">Authorization</text>
  <text class="small" x="790" y="312">Role capability checks</text>
  <path class="arrow" d="M600 174 L600 218 L410 218 L410 276"/>
  <path class="arrow" d="M540 299 L660 299"/>

  <rect class="layer" x="60" y="374" width="1080" height="390"/>
  <text class="layer-title" x="82" y="404">Business / Application Layer</text>

