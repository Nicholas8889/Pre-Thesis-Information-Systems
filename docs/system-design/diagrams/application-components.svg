  <path class="arrow" d="M790 322 L790 362 L600 362 L600 386"/>

  <path class="arrow" d="M275 457 L315 457"/>
  <path class="arrow" d="M495 457 L535 457"/>
  <path class="arrow" d="M715 457 L755 457"/>
  <path class="arrow" d="M915 457 L955 457"/>
  <path class="arrow" d="M625 484 L625 587 L645 587"/>
  <path class="arrow" d="M835 484 L835 526 L735 526 L735 560"/>
  <path class="arrow" d="M1030 484 L1030 526 L975 526 L975 560"/>
  <path class="arrow" d="M835 484 L835 540 L975 540 L975 560"/>

  <path class="dash" d="M625 484 L625 640 L600 660"/>
  <path class="dash" d="M835 484 L835 636 L650 672"/>
  <path class="dash" d="M735 614 L625 660"/>
  <path class="dash" d="M975 614 L975 660"/>

  <rect class="layer" x="60" y="792" width="1080" height="112"/>
  <text class="layer-title" x="82" y="822">Data Access Layer</text>
  <rect class="box" x="450" y="836" width="300" height="46" fill="#fff7ed" stroke="#ea580c"/>
  <text class="label" x="600" y="855">Prisma / Data Access</text>
  <text class="small" x="600" y="872">Prisma Client and application queries</text>

  <path class="arrow" d="M600 764 L600 836"/>
  <path class="arrow" d="M230 714 L230 792 L480 792 L480 836"/>

  <rect class="layer" x="60" y="932" width="1080" height="108"/>
  <text class="layer-title" x="82" y="962">Database and Storage Layer</text>
  <rect class="box" x="310" y="978" width="260" height="42" fill="#fef2f2" stroke="#dc2626"/>
  <text class="label" x="440" y="1004">Supabase PostgreSQL</text>
  <rect class="box" x="640" y="978" width="260" height="42" fill="#fef2f2" stroke="#dc2626"/>
  <text class="label" x="770" y="1004">Supabase Storage</text>

  <path class="arrow" d="M560 882 L455 978"/>
  <path class="arrow" d="M230 714 L230 918 L770 918 L770 978"/>
