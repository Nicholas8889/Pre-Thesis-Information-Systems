<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Arial, Segoe UI, sans-serif">
  <rect width="1280" height="720" fill="#f8fafc"/>
  <text x="64" y="68" font-size="34" font-weight="700" fill="#17212b">Describe Environment - Deployment Diagram</text>
  <text x="64" y="104" font-size="18" fill="#64748b">CV Tajuk Revenue Cycle Information System MVP - updated 19 July 2026</text>

  <rect x="70" y="180" width="210" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="175" y="228" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">User Browser</text>
  <text x="175" y="260" text-anchor="middle" font-size="16" fill="#64748b">Sales / Admin / Manager</text>

  <rect x="390" y="145" width="250" height="110" rx="10" fill="#eef6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="515" y="193" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">GitHub</text>
  <text x="515" y="225" text-anchor="middle" font-size="16" fill="#64748b">Source code repository</text>

  <rect x="390" y="345" width="250" height="125" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
  <text x="515" y="393" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Vercel</text>
  <text x="515" y="424" text-anchor="middle" font-size="16" fill="#64748b">Next.js hosted app</text>
  <text x="515" y="450" text-anchor="middle" font-size="14" fill="#64748b">prisma generate + next build</text>

  <rect x="775" y="180" width="245" height="110" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="897" y="228" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Supabase PostgreSQL</text>
  <text x="897" y="260" text-anchor="middle" font-size="16" fill="#64748b">Operational database</text>

  <rect x="775" y="380" width="245" height="110" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="897" y="428" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Supabase Storage</text>
  <text x="897" y="460" text-anchor="middle" font-size="16" fill="#64748b">Customer PO PO documents</text>

  <rect x="1055" y="300" width="170" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1140" y="345" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Outputs</text>
  <text x="1140" y="374" text-anchor="middle" font-size="15" fill="#64748b">Print / PDF</text>
  <text x="1140" y="398" text-anchor="middle" font-size="15" fill="#64748b">Excel export</text>

  <line x1="280" y1="235" x2="390" y2="405" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="515" y1="255" x2="515" y2="345" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="405" x2="775" y2="235" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="420" x2="775" y2="435" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1020" y1="435" x2="1055" y2="355" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="325" y="310" font-size="14" fill="#475569">HTTPS</text>
  <text x="536" y="305" font-size="14" fill="#475569">Deploy trigger</text>
  <text x="678" y="310" font-size="14" fill="#475569">Prisma</text>
  <text x="674" y="450" font-size="14" fill="#475569">Upload/download</text>

  <rect x="390" y="535" width="630" height="86" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="705" y="568" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Required Vercel Environment Variables</text>
  <text x="705" y="598" text-anchor="middle" font-size="15" fill="#64748b">DATABASE_URL, DIRECT_URL, AUTH_SECRET, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, SUPABASE_PRE_ORDER_BUCKET</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
