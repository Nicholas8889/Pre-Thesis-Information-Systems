<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" role="img" aria-labelledby="title desc">
  <title id="title">Describe the Environment - CV Tajuk Revenue Cycle Information System</title>
  <desc id="desc">Logical environment diagram showing users, browser, web application, business logic, Prisma data access, database, file storage, and an existing stock system that is not integrated.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 22px Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .subtitle { font: 400 13px Arial, sans-serif; fill: #475569; text-anchor: middle; }
      .box { stroke-width: 1.6; rx: 12; }
      .label { font: 700 15px Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .small { font: 400 12px Arial, sans-serif; fill: #475569; text-anchor: middle; }
      .arrow { fill: none; stroke: #475569; stroke-width: 1.8; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 7 6; }
      .dash-label { font: 400 12px Arial, sans-serif; fill: #64748b; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1180" height="560" fill="#ffffff"/>
  <text class="title" x="590" y="38">Describe the Environment</text>
  <text class="subtitle" x="590" y="62">CV Tajuk Revenue Cycle Information System - Logical Environment for Thesis Project</text>

  <rect class="box" x="50" y="155" width="160" height="86" fill="#dbeafe" stroke="#2563eb"/>
  <text class="label" x="130" y="181">Pengguna</text>
  <text class="small" x="130" y="201">Staff Sales, Staff Admin</text>
  <text class="small" x="130" y="218">General Manager</text>
  <text class="small" x="130" y="235">Administrator</text>

  <rect class="box" x="260" y="160" width="150" height="76" fill="#dbeafe" stroke="#2563eb"/>
  <text class="label" x="335" y="190">Browser</text>
  <text class="small" x="335" y="210">Laptop / PC</text>
  <text class="small" x="335" y="226">Local or Internet URL</text>

  <rect class="box" x="460" y="152" width="180" height="92" fill="#ecfdf5" stroke="#059669"/>
  <text class="label" x="550" y="181">CV Tajuk Revenue</text>
  <text class="label" x="550" y="200">Cycle Web App</text>
  <text class="small" x="550" y="220">Next.js Application</text>
  <text class="small" x="550" y="236">Localhost or Vercel</text>

  <rect class="box" x="690" y="154" width="180" height="88" fill="#ecfdf5" stroke="#059669"/>
  <text class="label" x="780" y="184">Business Logic</text>
  <text class="small" x="780" y="204">Server Actions</text>
  <text class="small" x="780" y="221">API Routes</text>

  <rect class="box" x="920" y="160" width="160" height="76" fill="#fff7ed" stroke="#ea580c"/>
  <text class="label" x="1000" y="190">Prisma /</text>
  <text class="label" x="1000" y="209">Data Access</text>

  <rect class="box" x="800" y="335" width="190" height="74" fill="#fff7ed" stroke="#ea580c"/>
  <text class="label" x="895" y="365">Supabase</text>
  <text class="label" x="895" y="384">PostgreSQL</text>
  <text class="small" x="895" y="401">Operational Database</text>

