  <path class="arrow" d="M640 198 L690 198"/>
  <path class="arrow" d="M870 198 L920 198"/>
  <path class="arrow" d="M1000 236 L1000 288 L895 288 L895 335"/>
  <path class="arrow" d="M780 242 L780 294 L655 294 L655 335"/>

  <path class="dash" d="M180 338 L180 282 L130 282 L130 241"/>
